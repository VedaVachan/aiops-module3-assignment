apiVersion: batch/v1
kind: Job
metadata:
  name: shard-validator
spec:
  completions: 8
  parallelism: 4
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: validator
          image: shard-validator:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "1"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
  backoffLimit: 4
